# CCGS project configuration — single source of truth for project settings.
# See .claude/docs/effects-map.md for full schema.

schema_version: 1

framework:
  version: 1.2.0
  last_upgraded: 2026-10-19

# NOTE: this template ships with no `modes:` block, and the six knobs below must
# never be added to one.
#
# `/start` DOES add `modes.rigor` and `modes.automation` here — that is its job,
# and a `modes:` block containing those two is the expected state of a configured
# project, not a mistake.
#
# What must stay absent is the six knobs `modes.rigor` FRONTS:
# `modes.review_mode`, `modes.workflow`, `docs.density`, `qa.level`,
# `modes.story_granularity` and `team.size`. Seeding any of them in this file
# pins that value and shadows the rigor expansion, so the rigor `/start` infers
# and saves would stop changing anything. `/start` states the same rule for the
# settings it writes.
#
# Per-developer preferences belong in `project.local.yaml` (gitignored), not
# here. `/settings --local <key>=<value>` writes there; `/settings <key>=<value>`
# edits this file. See `.claude/docs/config-resolution.md` for the full
# precedence order.

project:
  name: "Aether Sigil: Chronicles of the Prism Realms"
  genre: "Tactical monster-board / turn-based tactics"
  version: "0.1.0"
  kind: game
  owner: "Shady"             # informational; no CCGS skill reads it
  # stage: written by .claude/scripts/set-stage.sh (see below), never by hand

platform:
  multiplayer: false
  online: false
  targets: [Mobile]          # Android + iOS first; PC later
  primary_input: "Touch"
  gamepad_support: "None"
  touch_support: "Full"
  cert_tier: none

engine:
  name: "Godot"
  version: "4.7.2"
  language: "GDScript"
  rendering: "Compatibility"   # game/project.godot: gl_compatibility (desktop + mobile)
  physics: "Godot Physics 2D"  # 2D project (Node2D board, isometric projection in code)
  # The Godot project lives in game/, not the repo root. code_root is a LOCAL
  # PATCH key (docs/ccgs/LOCAL-PATCHES.md): stock CCGS hard-codes src/ for Godot.
  code_root: "game"
  # Editor binary: gitignored, present only in the main checkout.
  path: "E:/Shady'sPC/Lab station/Emberwick/engine/Godot_v4.7.2-stable_win64_console.exe"

specialists:
  code: "godot-gdscript-specialist"
  shader: "godot-shader-specialist"
  ui: "godot-specialist"
  additional: ["godot-gdextension-specialist"]

naming:
  classes: PascalCase
  variables: snake_case
  constants: SCREAMING_SNAKE
  signals: past_tense
  files: snake_case
  scenes: snake_case

testing:
  framework: custom          # game/run_tests.sh drives headless res://tests/*.gd scripts; no gdUnit4

commands:
  # Run from the repo root. $GODOT overrides the editor path; the fallback is the
  # repo-relative engine/ binary (exists in the main checkout only).
  build: "[TO BE CONFIGURED]"   # no export preset yet; set to the Android/iOS preset name
  test: "bash game/run_tests.sh"
  run: '"${GODOT:-engine/Godot_v4.7.2-stable_win64_console.exe}" --path game --windowed --resolution 540x960'
  smoke: '"${GODOT:-engine/Godot_v4.7.2-stable_win64_console.exe}" --headless --path game --quit-after 120'

updates:
  check: true

modes:
  rigor: minimal
